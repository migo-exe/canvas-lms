version: '3'

services:
  db:
    image: postgres:12
    environment:
      - POSTGRES_PASSWORD=canvas_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=canvas
    volumes:
      - canvas_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "bundle exec rake db:create db:initial_setup || bundle exec rails server -b 0.0.0.0"
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgres://postgres:canvas_password@db/canvas
      - REDIS_URL=redis://redis:6379/0
      - CANVAS_ENCRYPTION_KEY=genera_una_clave_de_32_caracteres_aqui
      - ECOSYSTEM_KEY=genera_otra_clave_de_32_caracteres_aqui
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

volumes:
  canvas_db_data:
