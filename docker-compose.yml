version: '3'
services:
  db:
    image: postgres:12
    environment:
      - POSTGRES_PASSWORD=canvas_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=canvas
    volumes:
      - canvas_db_data:/var/lib/postgresql/data
  redis:
    image: redis:6-alpine
  web:
    build: .
    environment:
      - RAILS_ENV=production
      - DATABASE_URL=postgres://postgres:canvas_password@db/canvas
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis

volumes:
  canvas_db_data:
