version: '3'
services:
  canvas-db:
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: canvas_password
      POSTGRES_USER: postgres
      POSTGRES_DB: canvas
    volumes:
      - canvas_db_data:/var/lib/postgresql/data
  canvas-redis:
    image: redis:6-alpine
  canvas-web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:canvas_password@canvas-db/canvas
      REDIS_URL: redis://canvas-redis:6379/0
      CANVAS_ENCRYPTION_KEY: "sustituye_por_32_caracteres_minimo_aqui"
      ECOSYSTEM_KEY: "sustituye_por_32_caracteres_minimo_aqui"
    ports:
      - "3000:3000"
    depends_on:
      - canvas-db
      - canvas-redis

volumes:
  canvas_db_data:
